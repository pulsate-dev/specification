# この CI ではあくまでテストとビルド, フォーマットの検証のみを行う

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5

      - name: Run fmt
        run: |
          mise run format:check

      - name: Run test
        run: |
          mise run test

      - name: Run build
        run: |
          mise run build
